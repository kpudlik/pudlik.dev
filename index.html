<style>

    --bg: #0b0716; --card: #0d0918; --fg: #eee7ff; --muted: #c4a6d6;

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var card = document.getElementById('card');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, dpr = 1;
  var pointer = null, pointerSeq = 0;

  // portrait.webp is the dotted portrait on a transparent background. It is cut
  // into TILES x TILES squares and every non-empty square is one particle, so the
  // assembled state is exactly the source image.
  var TILES = 64;
  var img = new Image();
  var imgReady = false;
  img.onload = function () { imgReady = true; portrait.resize(); };
  img.src = 'portrait.webp';

  var coverage = null;
  function tileCoverage() {
    if (coverage) return coverage;
    var n = img.naturalWidth, ts = n / TILES;
    var off = document.createElement('canvas');
    off.width = n; off.height = n;
    var o = off.getContext('2d');
    o.drawImage(img, 0, 0);
    var d;
    try { d = o.getImageData(0, 0, n, n).data; } catch (e) { return null; }
    var cov = new Float32Array(TILES * TILES);
    for (var y = 0; y < n; y++) {
      var row = Math.min(TILES - 1, (y / ts) | 0) * TILES;
      for (var x = 0; x < n; x++) {
        var al = d[(y * n + x) * 4 + 3];
        if (al) cov[row + Math.min(TILES - 1, (x / ts) | 0)] += al;
      }
    }
    for (var i = 0; i < cov.length; i++) cov[i] /= 255 * ts * ts;
    coverage = cov;
    return cov;
  }

  // ---------- Particles assemble into the portrait ----------
  function Particles() {
    var ps = [], targets = [], step = 5, size = 0, ox = 0, oy = 0;
    // The portrait pre-scaled to its on-screen size, so tiles blit 1:1 from it.
    var sprite = document.createElement('canvas'), spriteStep = 1;
    var formed = false, formTimer = 0, busy = false;
    // Idle tracking: once nothing moves, stop redrawing until something changes.
    var resting = false, dirty = true, seenSeq = -1;

    function computeStage() {
      var cr = card.getBoundingClientRect();
      var top = 32, bottom = Math.min(H - 24, cr.top - 24);
      if (bottom - top < 200) bottom = H - 24;
      var stage = { x: W * 0.04, y: top, w: W * 0.92, h: Math.max(160, bottom - top) };
      // Tiles are a whole number of device pixels and start on a device pixel,
      // so clearing a tile's home slot leaves no hairline seams behind.
      var tilePx = Math.max(1, Math.floor(Math.min(stage.w, stage.h) * dpr / TILES));
      step = tilePx / dpr;
      size = step * TILES;
      ox = Math.round((stage.x + (stage.w - size) / 2) * dpr) / dpr;
      oy = Math.round((stage.y + (stage.h - size) / 2) * dpr) / dpr;
      spriteStep = tilePx;
      if (imgReady) {
        sprite.width = tilePx * TILES; sprite.height = tilePx * TILES;
        sprite.getContext('2d').drawImage(img, 0, 0, sprite.width, sprite.height);
      }
    }

    function portraitTargets() {
      if (!imgReady) return [];
      var cov = tileCoverage();
      if (!cov) return [];
      var pts = [];
      for (var y = 0; y < TILES; y++) for (var x = 0; x < TILES; x++) {
        if (cov[y * TILES + x] < 0.01) continue;
        pts.push({ x: ox + x * step, y: oy + y * step, sx: x * spriteStep, sy: y * spriteStep, row: y / TILES });
      }
      return pts;
    }

    function assign(jump) {
      dirty = true;
      var N = targets.length;
      if (!N) return;
      while (ps.length < N) ps.push({ x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, tx: 0, ty: 0, a: 0.35, ta: 0.35, k: 0.6, tk: 0.6, d: 0, sx: 0, sy: 0 });
      ps.length = N;
      var order = targets.map(function (_, i) { return i; });
      for (var i = order.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0; var t = order[i]; order[i] = order[j]; order[j] = t; }
      ps.forEach(function (p, i) {
        var q = targets[order[i]];
        p.sx = q.sx; p.sy = q.sy;
        if (formed) {
          p.tx = q.x; p.ty = q.y; p.ta = 1; p.tk = 1;
          p.d = reduce ? 0 : 6 + q.row * 40 + Math.random() * 25;
        } else {
          var ang = Math.random() * 6.283, r = Math.sqrt(Math.random());
          p.tx = W / 2 + Math.cos(ang) * r * W * 0.55;
          p.ty = H / 2 + Math.sin(ang) * r * H * 0.55;
          p.ta = 0.4; p.tk = 0.6; p.d = Math.random() * 10;
        }
        if (reduce || jump) { p.x = p.tx; p.y = p.ty; p.a = p.ta; p.k = p.tk; }
      });
    }

    function setFormed(v) { formed = v; assign(false); }

    return {
      start: function () {
        this.resize();
        clearTimeout(formTimer);
        formTimer = setTimeout(function () { setFormed(true); }, reduce ? 0 : 500);
      },
      resize: function () {
        dirty = true;
        computeStage();
        targets = portraitTargets();
        assign(reduce);
      },
      rebuild: function () {
        if (busy) return;
        busy = true;
        setFormed(false);
        clearTimeout(formTimer);
        formTimer = setTimeout(function () { setFormed(true); busy = false; }, reduce ? 0 : 1300);
      },
      frame: function () {
        if (!imgReady || !ps.length) return;
        if (resting && !dirty && pointerSeq === seenSeq) return;
        seenSeq = pointerSeq;
        var m = pointer, R = 100, ss = spriteStep, moving = [];
        for (var i = 0; i < ps.length; i++) {
          var p = ps[i];
          if (p.d > 0) { p.d--; moving.push(p); continue; }
          p.vx += (p.tx - p.x) * 0.035; p.vy += (p.ty - p.y) * 0.035;
          if (m) {
            var dx = p.x - m.x, dy = p.y - m.y;
            if (dx > -R && dx < R && dy > -R && dy < R) {
              var dd = Math.sqrt(dx * dx + dy * dy);
              if (dd < R && dd > 0.1) { var f = (1 - dd / R) * 4; p.vx += dx / dd * f; p.vy += dy / dd * f; }
            }
          }
          p.vx *= 0.85; p.vy *= 0.85;
          p.x += p.vx; p.y += p.vy;
          p.a += (p.ta - p.a) * 0.05;
          p.k += (p.tk - p.k) * 0.05;
          if (Math.abs(p.tx - p.x) + Math.abs(p.ty - p.y) > 0.25 || Math.abs(p.tk - p.k) > 0.01) moving.push(p);
          else { p.x = p.tx; p.y = p.ty; p.k = p.tk; p.a = p.ta; }
        }
        // A pointer move that disturbed nothing leaves the canvas as it is.
        if (resting && !dirty && !moving.length) return;
        resting = !moving.length;
        dirty = false;
        ctx.clearRect(0, 0, W, H);
        var n;
        if (formed && moving.length < ps.length * 0.4) {
          // Mostly at rest: one blit of the whole portrait, then patch only the
          // tiles that are away from home (clear their slot, draw them where they are).
          ctx.drawImage(sprite, ox, oy, size, size);
          for (n = 0; n < moving.length; n++) ctx.clearRect(moving[n].tx, moving[n].ty, step, step);
          for (n = 0; n < moving.length; n++) drawTile(moving[n]);
        } else {
          for (n = 0; n < ps.length; n++) if (!(ps[n].d > 0 && !formed)) drawTile(ps[n]);
        }
        ctx.globalAlpha = 1;

        function drawTile(q) {
          var s = step * q.k;
          ctx.globalAlpha = q.a;
          ctx.drawImage(sprite, q.sx, q.sy, ss, ss, q.x + (step - s) / 2, q.y + (step - s) / 2, s, s);
        }
      }
    };
  }

  var portrait = Particles();

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    portrait.resize();
  }

  document.getElementById('rebuild').addEventListener('click', function () { portrait.rebuild(); });

  window.addEventListener('pointermove', function (e) { pointer = { x: e.clientX, y: e.clientY }; pointerSeq++; });
  window.addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') { pointer = null; pointerSeq++; } });
  window.addEventListener('pointercancel', function () { pointer = null; pointerSeq++; });
  document.addEventListener('mouseleave', function () { pointer = null; pointerSeq++; });

  var resizeTimer = 0;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { portrait.resize(); });

  resize();
  portrait.start();

  (function loop() {
    portrait.frame();
    requestAnimationFrame(loop);
  })();
})();
</script>
